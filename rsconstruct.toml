# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# The mermaid processor's `command` override below points at the wrapper
# script, so `tools install` checks for the script — not mmdc — and never
# installs mermaid-cli on its own. mmdc comes from package.json /
# package-lock.json instead: `tools install-deps` runs `npm ci`, and
# rsconstruct puts node_modules/.bin on PATH for the wrapper.

# lint the shell scripts with shellcheck
[processor.checker.shellcheck]
src_dirs = ["scripts"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "rsconstruct.toml"]

# Render mermaid/**/*.mmd to docs/mermaid/**.{png,pdf,svg}. The outputs are
# committed — this repo serves them as raw web assets — so they go under
# docs/, not out/. .mmdc.config.json is the puppeteer config every render
# uses, so any change to it rebuilds all diagrams.
[processor.generator.mermaid]
src_dirs = ["mermaid"]
# Wrapper around mmdc that pins the PDF /CreationDate & /ModDate Chromium
# stamps into the output — without it every render is binary-different.
command = "scripts/mmdc-deterministic.sh"
output_dir = "docs/mermaid"
formats = ["png", "pdf", "svg"]
args = ["-p", ".mmdc.config.json"]
dep_inputs = [".mmdc.config.json"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_files = [".mmdc.config.json", "package.json"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.ixmllint]
src_dirs = ["docs"]
