# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# Render mermaid/**/*.mmd to docs/mermaid/**.{png,pdf,svg}. The outputs are
# committed — this repo serves them as raw web assets — so they go under
# docs/, not out/. .mmdc.config.json is the puppeteer config every render
# uses, so any change to it rebuilds all diagrams.
[processor.mermaid]
src_dirs = ["mermaid"]
# Wrapper around mmdc that pins the PDF /CreationDate & /ModDate Chromium
# stamps into the output — without it every render is binary-different.
command = "scripts/mmdc-deterministic.sh"
output_dir = "docs/mermaid"
formats = ["png", "pdf", "svg"]
args = ["-p", ".mmdc.config.json"]
dep_inputs = [".mmdc.config.json"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
